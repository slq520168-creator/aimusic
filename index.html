<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Music</title>
<style>
:root{--bg:#0b1020;--card:#151c32;--soft:#202a48;--text:#f7f9ff;--muted:#9da8c8;--accent:#7c5cff;--accent2:#25c7ff;--ok:#31d6a2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#202a58 0,#0b1020 48%);color:var(--text);min-height:100vh}.app{max-width:720px;margin:auto;padding:24px 18px 124px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-weight:900;font-size:24px}.badge{font-size:12px;color:#b9c3df;background:#ffffff10;padding:7px 10px;border-radius:99px}.hero{padding:26px 22px;background:linear-gradient(135deg,#795cff,#159bd7);border-radius:26px;box-shadow:0 20px 60px #0005}.hero h1{font-size:31px;margin:0 0 9px}.hero p{margin:0;color:#eef3ff;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.btn{border:0;border-radius:16px;padding:15px;font-weight:800;font-size:15px;background:#fff;color:#10162a}.btn:disabled{opacity:.55}.btn.alt{background:var(--soft);color:white}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}.section-title h2{font-size:19px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.song{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid #ffffff0d;border-radius:18px;margin:9px 0}.song.active{border-color:#7c5cff88;background:#1a2240}.cover{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#25c7ff);display:grid;place-items:center;font-size:22px}.song b{display:block;margin-bottom:5px}.song small{color:var(--muted);line-height:1.4}.play{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:16px}.empty{padding:28px;text-align:center;color:var(--muted);background:#ffffff08;border:1px dashed #ffffff22;border-radius:18px}.player{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(calc(100% - 24px),696px);background:#11182df2;backdrop-filter:blur(18px);border:1px solid #ffffff18;border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;box-shadow:0 15px 50px #0008;z-index:4}.now{min-width:0}.now small{color:var(--muted);display:block;margin-bottom:3px}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:8px}.controls button{width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#111;font-size:16px}.modal{position:fixed;inset:0;background:#050814d9;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:5}.modal.show{display:flex}.sheet{width:min(100%,700px);max-height:92vh;overflow:auto;background:#151c32;border-radius:26px;padding:20px}.sheet h3{margin:0 0 16px}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff1c;background:#0d1428;color:white;margin:7px 0;font-size:16px}.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0}.status{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#ffffff0a;color:#c9d3ef;font-size:13px;display:none}.status.show{display:block}.status.ok{color:#b8ffe8;background:#31d6a214}.hidden{display:none}.loading{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.55}}@media(min-width:900px){.app{max-width:980px}.songs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.song{margin:0}}
</style>
</head>
<body><main class="app"><header><div class="brand">♫ AI Music</div><div class="badge">原创 AI 音乐社区</div></header>
<section class="hero"><h1>让每个人都能发表自己的声音</h1><p>原创歌曲、AI 音乐与独立创作者的连续音乐频道。审核通过的作品自动进入公共播放队列。</p></section>
<div class="actions"><button class="btn" id="writeBtn">✦ AI 写歌</button><button class="btn alt" id="uploadBtn">↑ 上传作品</button></div>
<div class="section-title"><h2>公共曲库</h2><span id="count">正在连接曲库…</span></div><div id="songs" class="empty loading">正在读取审核通过的原创作品…</div>
</main>
<div class="player"><div class="now"><small>当前歌曲</small><b id="nowTitle">等待播放</b></div><div class="controls"><button id="prev" aria-label="上一首">‹</button><button id="toggle" aria-label="播放暂停">▶</button><button id="next" aria-label="下一首">›</button></div></div>
<audio id="audio" preload="metadata"></audio>
<div class="modal" id="uploadModal"><div class="sheet"><h3>上传原创歌曲</h3><input class="field" id="title" maxlength="120" placeholder="歌曲名称"><input class="field" id="artist" maxlength="80" placeholder="创作者名称"><select class="field" id="genre"><option>流行</option><option>电子</option><option>说唱</option><option>治愈</option><option>纯音乐</option><option>其他</option></select><textarea class="field" id="description" maxlength="500" rows="3" placeholder="歌曲简介（可选）"></textarea><input class="field" id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.webm"><p class="notice">可直接从本地“文件”选择 MP3 / M4A / WAV / OGG / WebM，单曲最大 15MB。仅上传你拥有权利或明确获准发布的作品。上传后进入待审核，审核通过才会公开播放。</p><div id="uploadStatus" class="status"></div><div class="row"><button class="btn alt close">取消</button><button class="btn" id="submit">提交审核</button></div></div></div>
<div class="modal" id="writeModal"><div class="sheet"><h3>AI 写歌</h3><p class="notice">正在加载真实 AI 歌曲创作入口…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://afzcohtnljnmucrkgcaz.supabase.co';
const SUPABASE_KEY='sb_publishable_EqF-kTNRsSZWhUE8LWB8DQ_UNkTjImv';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const audio=document.querySelector('#audio'),songsEl=document.querySelector('#songs'),now=document.querySelector('#nowTitle'),toggle=document.querySelector('#toggle');let songs=[],i=-1;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function publicUrl(path){return db.storage.from('aimusic-audio').getPublicUrl(path).data.publicUrl}
function render(){document.querySelector('#count').textContent=songs.length+' 首作品';if(!songs.length){songsEl.className='empty';songsEl.textContent='曲库还是空的。第一首原创作品审核通过后，就会从这里开始连续播放。';return}songsEl.className='songs-grid';songsEl.innerHTML=songs.map((s,n)=>`<div class="song ${n===i?'active':''}"><div class="cover">♫</div><div><b>${esc(s.title)}</b><small>${esc(s.artist)} · ${esc(s.genre)} · ${Number(s.plays||0)} 次播放</small></div><button class="play" data-i="${n}">${n===i&&!audio.paused?'Ⅱ':'▶'}</button></div>`).join('');document.querySelectorAll('.play').forEach(b=>b.onclick=()=>{const n=+b.dataset.i;if(n===i&&!audio.paused){audio.pause();toggle.textContent='▶';render()}else if(n===i&&audio.paused){audio.play();toggle.textContent='Ⅱ';render()}else play(n)})}
async function loadSongs(){const {data,error}=await db.from('aimusic_tracks').select('id,title,artist,genre,storage_path,plays,created_at').eq('status','approved').order('approved_at',{ascending:false});if(error){songsEl.className='empty';songsEl.textContent='曲库连接失败，请稍后刷新。';document.querySelector('#count').textContent='连接失败';return}songs=(data||[]).map(s=>({...s,url:publicUrl(s.storage_path)}));render()}
async function recordPlay(s){if(!s?.id)return;try{const {data}=await db.rpc('aimusic_record_play',{track_id:s.id});if(typeof data==='number')s.plays=data}catch{}}
async function play(n){if(!songs.length)return;i=(n+songs.length)%songs.length;const s=songs[i];audio.src=s.url;now.textContent=s.title+' · '+s.artist;try{await audio.play();toggle.textContent='Ⅱ';recordPlay(s);render()}catch{toggle.textContent='▶';render()}}
audio.onended=()=>play(i+1);audio.onpause=()=>{toggle.textContent='▶';render()};audio.onplay=()=>{toggle.textContent='Ⅱ';render()};document.querySelector('#next').onclick=()=>play(i<0?0:i+1);document.querySelector('#prev').onclick=()=>play(i<0?0:i-1);toggle.onclick=()=>{if(!songs.length)return;if(i<0)return play(0);if(audio.paused)audio.play();else audio.pause()};
const uploadModal=document.querySelector('#uploadModal'),writeModal=document.querySelector('#writeModal');document.querySelector('#uploadBtn').onclick=()=>uploadModal.classList.add('show');document.querySelector('#writeBtn').onclick=()=>writeModal.classList.add('show');document.querySelectorAll('#uploadModal .close').forEach(x=>x.onclick=()=>x.closest('.modal').classList.remove('show'));
function setUploadStatus(text,ok=false){const e=document.querySelector('#uploadStatus');e.textContent=text;e.className='status show'+(ok?' ok':'')}
document.querySelector('#submit').onclick=async()=>{const btn=document.querySelector('#submit'),f=document.querySelector('#file').files[0],title=document.querySelector('#title').value.trim(),artist=document.querySelector('#artist').value.trim(),genre=document.querySelector('#genre').value,description=document.querySelector('#description').value.trim();if(!f||!title||!artist){setUploadStatus('请填写歌名、创作者并选择音频文件');return}if(f.size>15*1024*1024){setUploadStatus('文件超过 15MB，请压缩后再上传');return}btn.disabled=true;setUploadStatus('正在上传歌曲，请不要关闭页面…');const ext=(f.name.split('.').pop()||'audio').toLowerCase().replace(/[^a-z0-9]/g,'');const path='submissions/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;try{const meta=await db.from('aimusic_tracks').insert({title,artist,genre,description,storage_path:path,status:'pending',plays:0});if(meta.error)throw meta.error;const up=await db.storage.from('aimusic-audio').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type||undefined});if(up.error)throw up.error;setUploadStatus('提交成功 ✓ 作品已进入待审核，审核通过后会自动出现在公共曲库。',true);document.querySelector('#file').value='';setTimeout(()=>uploadModal.classList.remove('show'),1800)}catch(err){console.error(err);setUploadStatus('上传失败：'+(err?.message||'请稍后重试'))}finally{btn.disabled=false}};
loadSongs();
</script>
<script type="module" src="./ai-song.js?v=20260819-1"></script>
</body></html>
