<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Music</title>
<style>
:root{--bg:#f7f8fb;--panel:#fff;--line:#e8ebf1;--text:#171a22;--muted:#7b8190;--accent:#6f56e8;--soft:#f0effd;--ok:#148a66;--danger:#d94b5d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:860px;margin:auto;min-height:100vh;padding:0 14px 188px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#f7f8fbf2;backdrop-filter:blur(18px);z-index:3}.brand{font-size:23px;font-weight:900}.community{font-size:13px;text-decoration:none;color:#5f6470;font-weight:700}.guest{font-size:12px;color:var(--muted);padding:8px 0 4px}.list-head{display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:12px 4px 7px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}#songs{min-height:calc(100vh - 280px)}.song{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;min-height:72px;border-bottom:1px solid var(--line);padding:7px 2px}.song.active{background:#fff}.num{font-size:15px;font-weight:800;color:#9aa0ae;text-align:center}.song-main{min-width:0}.song b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}.song small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{width:38px;height:38px;border-radius:50%;border:0;background:#edeafc;color:var(--accent);font-size:15px;font-weight:900}.empty{padding:48px 16px;text-align:center;color:var(--muted)}.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,860px);padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#f7f8fbf5;backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:4}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.quick button{border:0;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 4px;font-weight:800;font-size:13px;color:#252936}.quick button:active{transform:scale(.98)}.player{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;box-shadow:0 8px 30px #1e22300c}.now{min-width:0}.now small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.controls{display:flex;gap:6px}.controls button{width:38px;height:38px;border:0;border-radius:50%;background:#f0effd;color:var(--accent);font-size:17px;font-weight:900}.controls #toggle{background:var(--accent);color:white}.modal{position:fixed;inset:0;background:#1b1e2866;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modal.show{display:flex}.sheet{width:min(100%,700px);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 18px 18px;padding:18px;color:var(--text)}.sheet h3{margin:0 0 14px}.field{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #dde1e9;background:#fafbfc;color:#171a22;margin:6px 0;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:13px;font-weight:800;font-size:14px;background:var(--accent);color:#fff}.btn.alt{background:#eff1f5;color:#303541}.btn:disabled{opacity:.55}.notice{font-size:12px;line-height:1.55;color:var(--muted);margin:8px 0}.status{display:none;padding:10px 12px;margin-top:8px;border-radius:12px;background:#f1f3f7;color:#5b6270;font-size:13px;line-height:1.45}.status.show{display:block}.status.ok{background:#e8f7f1;color:var(--ok)}.hidden{display:none}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:176px;z-index:20;background:#1e222b;color:white;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.points-big{font-size:34px;font-weight:900;margin:4px 0}.guest-url{word-break:break-all;background:#f5f6f8;padding:10px;border-radius:12px;font-size:12px;color:#5c6370}@media(min-width:900px){.app{padding-left:20px;padding-right:20px}.song{min-height:66px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand">♫ AI Music</div><a class="community" href="https://globalyouxuan520.netlify.app/">原创 AI 音乐社区 ↗</a></header>
  <div id="guestBar" class="guest">游客模式 · 上传/下载各 +500 积分 · 每日最高 2000</div>
  <div class="list-head"><span>编号</span><span>歌曲列表</span><span id="count">0首</span></div>
  <div id="songs" class="empty">正在读取歌曲…</div>
</main>

<div class="dock">
  <div class="quick"><button id="writeBtn">写歌</button><button id="uploadBtn">上传</button><button id="downloadBtn">下载</button><button id="pointsBtn">兑换积分</button></div>
  <div class="player"><div class="now"><small>当前歌曲</small><b id="nowTitle">等待歌曲</b></div><div class="controls"><button id="prev">‹</button><button id="toggle">▶</button><button id="next">›</button></div></div>
</div>
<audio id="audio" preload="metadata"></audio><div id="toast" class="toast"></div>

<div class="modal" id="uploadModal"><div class="sheet"><h3>上传原创歌曲</h3><input class="field" id="title" maxlength="120" placeholder="歌曲名称"><input class="field" id="artist" maxlength="80" placeholder="创作者名称"><select class="field" id="genre"><option>流行</option><option>电子</option><option>说唱</option><option>治愈</option><option>纯音乐</option><option>其他</option></select><textarea class="field" id="description" maxlength="500" rows="3" placeholder="歌曲简介（可选）"></textarea><input class="field" id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.webm"><p class="notice">上传成功 +500 积分；单日上传/下载合计最高 +2000。作品进入待审核，管理员可看到对应游客身份。</p><div id="uploadStatus" class="status"></div><div class="row"><button class="btn alt close">取消</button><button class="btn" id="submit">提交审核</button></div></div></div>
<div class="modal" id="writeModal"><div class="sheet"><h3>AI 写歌</h3><p class="notice">正在加载 AI 歌曲创作入口…</p></div></div>
<div class="modal" id="pointsModal"><div class="sheet"><h3>兑换积分</h3><div class="points-big"><span id="pointsValue">0</span> 积分</div><p id="guestCode" class="notice">完成一次上传或下载后，会自动生成临时游客身份。</p><div id="guestUrlBox" class="guest-url hidden"></div><p class="notice">游客积分先保存在临时身份中。需要兑换时联系客服并注册正式账号，游客积分会合并到会员积分；当前注册奖励为 +1500 积分。</p><div class="row"><button class="btn alt" id="copyGuestUrl">复制临时网址</button><button class="btn" id="closePoints">知道了</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://afzcohtnljnmucrkgcaz.supabase.co',SUPABASE_KEY='sb_publishable_EqF-kTNRsSZWhUE8LWB8DQ_UNkTjImv';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),audio=document.querySelector('#audio'),songsEl=document.querySelector('#songs'),now=document.querySelector('#nowTitle'),toggle=document.querySelector('#toggle');
let songs=[],i=-1,guestToken=localStorage.getItem('aimusic_guest_token')||'',guestInfo=null,guestUrl='';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function publicUrl(path){return db.storage.from('aimusic-audio').getPublicUrl(path).data.publicUrl}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),2200)}
async function guestApi(body){const r=await fetch(SUPABASE_URL+'/functions/v1/aimusic-guest-points',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||j.error||'游客积分服务失败');return j}
function updateGuestUI(){const b=document.querySelector('#guestBar');if(guestInfo){b.textContent=`游客 ${guestInfo.display_code} · ${guestInfo.points} 积分 · 上传/下载各 +500 · 每日最高 2000`;document.querySelector('#pointsValue').textContent=guestInfo.points;document.querySelector('#guestCode').textContent='临时游客：'+guestInfo.display_code}else{b.textContent='游客模式 · 上传/下载各 +500 积分 · 每日最高 2000';document.querySelector('#pointsValue').textContent='0';document.querySelector('#guestCode').textContent='完成一次上传或下载后，会自动生成临时游客身份。'}const box=document.querySelector('#guestUrlBox');if(guestUrl){box.textContent=guestUrl;box.classList.remove('hidden')}else box.classList.add('hidden')}
async function ensureGuest(){if(guestToken){try{guestInfo=await guestApi({action:'status',token:guestToken});guestUrl='https://aimusic-mauve.vercel.app/?g='+encodeURIComponent(guestToken);updateGuestUI();return guestInfo}catch{localStorage.removeItem('aimusic_guest_token');guestToken=''}}const j=await guestApi({action:'issue'});guestToken=j.token;guestInfo=j;guestUrl=j.guest_url;localStorage.setItem('aimusic_guest_token',guestToken);history.replaceState(null,'',location.pathname+'?g='+encodeURIComponent(guestToken));updateGuestUI();return j}
async function award(kind,resource){try{await ensureGuest();const j=await guestApi({action:'award',token:guestToken,kind,resource_id:String(resource)});guestInfo={...guestInfo,...j,display_code:guestInfo.display_code};updateGuestUI();if(j.awarded>0)toast(`+${j.awarded} 积分`);else if(j.daily_earned>=j.daily_cap)toast('今日积分已达 2000 上限')}catch(e){console.error(e)}}
window.AIMUSIC_GUEST_AWARD=award;
async function restoreGuest(){const q=new URLSearchParams(location.search).get('g');if(q){guestToken=q;localStorage.setItem('aimusic_guest_token',q)}if(!guestToken)return;try{guestInfo=await guestApi({action:'status',token:guestToken});guestUrl='https://aimusic-mauve.vercel.app/?g='+encodeURIComponent(guestToken);updateGuestUI()}catch{guestToken='';localStorage.removeItem('aimusic_guest_token')}}
function render(){document.querySelector('#count').textContent=songs.length+'首';if(!songs.length){songsEl.className='empty';songsEl.textContent='还没有审核通过的歌曲。';now.textContent='等待歌曲';return}songsEl.className='';songsEl.innerHTML=songs.map((s,n)=>`<div class="song ${n===i?'active':''}" data-i="${n}"><div class="num">${String(n+1).padStart(2,'0')}</div><div class="song-main"><b>${esc(s.title)}</b><small>${esc(s.artist)} · ${esc(s.genre)} · ${Number(s.plays||0)} 次播放</small></div><button class="play" data-i="${n}">${n===i&&!audio.paused?'Ⅱ':'▶'}</button></div>`).join('');document.querySelectorAll('.play').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=+b.dataset.i;if(n===i&&!audio.paused)audio.pause();else if(n===i)audio.play();else play(n)});document.querySelectorAll('.song').forEach(r=>r.onclick=()=>{i=+r.dataset.i;now.textContent=songs[i].title+' · '+songs[i].artist;render()})}
async function loadSongs(){const {data,error}=await db.from('aimusic_tracks').select('id,title,artist,genre,storage_path,plays,created_at').eq('status','approved').order('approved_at',{ascending:false});if(error){songsEl.className='empty';songsEl.textContent='曲库连接失败，请稍后刷新。';return}songs=(data||[]).map(s=>({...s,url:publicUrl(s.storage_path)}));if(songs.length&&i<0){i=0;now.textContent=songs[0].title+' · '+songs[0].artist}render()}
async function recordPlay(s){try{const {data}=await db.rpc('aimusic_record_play',{track_id:s.id});if(typeof data==='number')s.plays=data}catch{}}
async function play(n){if(!songs.length)return;i=(n+songs.length)%songs.length;const s=songs[i];audio.src=s.url;now.textContent=s.title+' · '+s.artist;try{await audio.play();toggle.textContent='Ⅱ';recordPlay(s);render()}catch{toggle.textContent='▶';render()}}
audio.onended=()=>play(i+1);audio.onpause=()=>{toggle.textContent='▶';render()};audio.onplay=()=>{toggle.textContent='Ⅱ';render()};document.querySelector('#next').onclick=()=>play(i<0?0:i+1);document.querySelector('#prev').onclick=()=>play(i<0?0:i-1);toggle.onclick=()=>{if(!songs.length)return;if(i<0)return play(0);audio.paused?audio.play():audio.pause()};
const uploadModal=document.querySelector('#uploadModal'),writeModal=document.querySelector('#writeModal'),pointsModal=document.querySelector('#pointsModal');document.querySelector('#uploadBtn').onclick=()=>uploadModal.classList.add('show');document.querySelector('#writeBtn').onclick=()=>writeModal.classList.add('show');document.querySelector('#pointsBtn').onclick=()=>{updateGuestUI();pointsModal.classList.add('show')};document.querySelector('#closePoints').onclick=()=>pointsModal.classList.remove('show');document.querySelectorAll('#uploadModal .close').forEach(x=>x.onclick=()=>uploadModal.classList.remove('show'));
function setUploadStatus(text,ok=false){const e=document.querySelector('#uploadStatus');e.textContent=text;e.className='status show'+(ok?' ok':'')}
document.querySelector('#submit').onclick=async()=>{const btn=document.querySelector('#submit'),f=document.querySelector('#file').files[0],title=document.querySelector('#title').value.trim(),artist=document.querySelector('#artist').value.trim(),genre=document.querySelector('#genre').value,description=document.querySelector('#description').value.trim();if(!f||!title||!artist){setUploadStatus('请填写歌名、创作者并选择音频文件');return}if(f.size>15*1024*1024){setUploadStatus('文件超过 15MB');return}btn.disabled=true;setUploadStatus('正在上传…');let path='';try{const g=await ensureGuest();const ext=(f.name.split('.').pop()||'audio').toLowerCase().replace(/[^a-z0-9]/g,'');path='submissions/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const up=await db.storage.from('aimusic-audio').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type||undefined});if(up.error)throw up.error;const meta=await db.from('aimusic_tracks').insert({title,artist,genre,description,storage_path:path,status:'pending',plays:0,guest_id:g.guest_id}).select('id').single();if(meta.error){await db.storage.from('aimusic-audio').remove([path]);throw meta.error}await award('upload',meta.data.id);setUploadStatus('提交成功 ✓ 已进入待审核。',true);document.querySelector('#file').value='';setTimeout(()=>uploadModal.classList.remove('show'),1200)}catch(err){console.error(err);setUploadStatus('上传失败：'+(err?.message||'请稍后重试'))}finally{btn.disabled=false}};
document.querySelector('#downloadBtn').onclick=async()=>{if(!songs.length){toast('当前没有可下载歌曲');return}const s=songs[i<0?0:i];try{toast('正在准备下载…');const r=await fetch(s.url);if(!r.ok)throw new Error('下载失败');const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=(s.title||'AI-Music')+'.mp3';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);await award('download',s.id)}catch(e){window.open(s.url,'_blank');toast('已打开歌曲文件') }};
document.querySelector('#copyGuestUrl').onclick=async()=>{if(!guestUrl){toast('先上传或下载一次生成临时身份');return}try{await navigator.clipboard.writeText(guestUrl);toast('临时网址已复制')}catch{toast('长按临时网址复制')}};
restoreGuest();loadSongs();
</script>
<script type="module" src="./ai-song.js?v=20260819-2"></script>
</body></html>
