<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>AI Music</title><style>
:root{--bg:#f7f8fb;--panel:#fff;--line:#e8ebf1;--text:#171a22;--muted:#7b8190;--accent:#6f56e8;--ok:#148a66}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;height:100dvh}html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.app{flex:1;min-height:0;width:100%;max-width:860px;margin:0 auto;padding:0 14px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#f7f8fbf2;z-index:3}.brand{font-size:23px;font-weight:900}.community{font-size:13px;text-decoration:none;color:#5f6470;font-weight:700}.guest{font-size:12px;color:var(--muted);padding:8px 0 4px}.list-head{display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:12px 4px 7px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}#songs{min-height:0}.song{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;min-height:72px;border-bottom:1px solid var(--line);padding:7px 2px}.song.active{background:#fff}.num{font-size:15px;font-weight:800;color:#9aa0ae;text-align:center}.song-main{min-width:0}.song b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}.song small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.play{width:38px;height:38px;border-radius:50%;border:0;background:#edeafc;color:var(--accent);font-size:15px;font-weight:900}.empty{padding:48px 16px;text-align:center;color:var(--muted)}.dock{flex:0 0 auto;position:relative;left:auto;bottom:auto;transform:none;width:100%;max-width:860px;margin:0 auto;padding:8px 12px max(10px,env(safe-area-inset-bottom));background:#f7f8fbf5;border-top:1px solid var(--line);z-index:4}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.quick button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 4px;font-weight:800;font-size:13px;color:#252936}.player{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.now{min-width:0}.now small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.controls{display:flex;gap:6px}.controls button{width:38px;height:38px;border:0;border-radius:50%;background:#f0effd;color:var(--accent);font-size:17px;font-weight:900}.controls #toggle{background:var(--accent);color:#fff}.modal{position:fixed;inset:0;background:#1b1e2866;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modal.show{display:flex}.sheet{width:min(100%,700px);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 18px 18px;padding:18px}.field{width:100%;padding:13px 14px;border-radius:13px;border:1px solid #dde1e9;background:#fafbfc;color:#171a22;margin:6px 0;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:13px;font-weight:800;font-size:14px;background:var(--accent);color:#fff}.btn.alt{background:#eff1f5;color:#303541}.btn:disabled{opacity:.55}.notice{font-size:12px;line-height:1.55;color:var(--muted);margin:8px 0}.status{display:none;padding:10px 12px;margin-top:8px;border-radius:12px;background:#f1f3f7;color:#5b6270;font-size:13px}.status.show{display:block}.status.ok{background:#e8f7f1;color:var(--ok)}.hidden{display:none}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:#1e222b;color:white;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.points-big{font-size:34px;font-weight:900;margin:4px 0}
</style></head><body>
<main class="app"><header class="top"><div class="brand">♫ AI Music</div><a class="community" id="communityLink" href="#">原创 AI 音乐社区 ↗</a></header><div id="guestBar" class="guest">游客模式 · 上传/下载各 +500 积分 · 每日最高 2000</div><div class="list-head"><span>编号</span><span>歌曲列表</span><span id="count">0首</span></div><div id="songs"></div></main>
<div class="dock"><div class="quick"><button id="writeBtn">写歌</button><button id="uploadBtn">上传</button><button id="downloadBtn">下载</button><button id="pointsBtn">兑换积分</button></div><div class="player"><div class="now"><small>当前歌曲</small><b id="nowTitle">等待歌曲</b></div><div class="controls"><button id="prev">‹</button><button id="toggle">▶</button><button id="next">›</button></div></div></div>
<audio id="audio" preload="none"></audio><div id="toast" class="toast"></div>
<div class="modal" id="uploadModal"><div class="sheet"><h3>上传原创歌曲</h3><input class="field" id="title" maxlength="120" placeholder="歌曲名称"><input class="field" id="artist" maxlength="80" placeholder="创作者名称"><select class="field" id="genre"><option>流行</option><option>电子</option><option>说唱</option><option>治愈</option><option>纯音乐</option><option>其他</option></select><textarea class="field" id="description" maxlength="500" rows="3" placeholder="歌曲简介（可选）"></textarea><input class="field" id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.webm"><p class="notice">上传成功 +500 积分；单日上传/下载合计最高 +2000。作品进入待审核。</p><div id="uploadStatus" class="status"></div><div class="row"><button class="btn alt close">取消</button><button class="btn" id="submit">提交审核</button></div></div></div>
<div class="modal" id="writeModal"><div class="sheet"></div></div>
<div class="modal" id="pointsModal"><div class="sheet"><h3>兑换积分</h3><div class="points-big"><span id="pointsValue">0</span> 积分</div><p id="guestCode" class="notice">完成一次上传或下载后，会自动建立游客积分身份。</p><div class="row"><button class="btn alt" id="closePoints">继续听歌</button><button class="btn" id="registerPoints">注册并兑换</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="./config.js?v=20260822-2"></script><script>
const CFG=window.AIMUSIC_CONFIG;if(!CFG)throw new Error('AIMUSIC_CONFIG_MISSING');
const {SUPABASE_URL,SUPABASE_KEY,STORAGE_BUCKET,MAIN_SITE,FUNCTIONS}=CFG;
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);window.AIMUSIC_DB=db;window.AIMUSIC_BUCKET=STORAGE_BUCKET;const audio=document.querySelector('#audio'),songsEl=document.querySelector('#songs'),now=document.querySelector('#nowTitle'),toggle=document.querySelector('#toggle');
const fn=name=>SUPABASE_URL+'/functions/v1/'+name;
const TRACK_CACHE='aimusic_tracks_cache';
let songs=[],i=-1,guestToken=localStorage.getItem('aimusic_guest_token')||'',guestInfo=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'&quot',"'":'&#39;'}[m]));
function publicUrl(path){return db.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),2200)}
async function guestApi(body){const r=await fetch(fn(FUNCTIONS.GUEST_POINTS),{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||j.error||'游客积分服务失败');return j}
function updateGuestUI(){const b=document.querySelector('#guestBar');if(guestInfo){b.textContent=`游客 ${guestInfo.display_code} · ${guestInfo.points} 积分 · 上传/下载各 +500 · 每日最高 2000`;document.querySelector('#pointsValue').textContent=guestInfo.points;document.querySelector('#guestCode').textContent='游客编号：'+guestInfo.display_code}else{b.textContent='游客模式 · 上传/下载各 +500 积分 · 每日最高 2000';document.querySelector('#pointsValue').textContent='0';document.querySelector('#guestCode').textContent='完成一次上传或下载后，会自动建立游客积分身份。'}}
async function ensureGuest(){if(guestToken){try{guestInfo=await guestApi({action:'status',token:guestToken});updateGuestUI();return {token:guestToken,...guestInfo}}catch{localStorage.removeItem('aimusic_guest_token');guestToken=''}}const j=await guestApi({action:'issue'});guestToken=j.token;guestInfo=j;localStorage.setItem('aimusic_guest_token',guestToken);updateGuestUI();return {token:guestToken,...j}}
async function award(kind,resource){try{await ensureGuest();const j=await guestApi({action:'award',token:guestToken,kind,resource_id:String(resource)});guestInfo={...guestInfo,...j,display_code:guestInfo.display_code};updateGuestUI();if(j.awarded>0)toast(`+${j.awarded} 积分`);else if(j.daily_earned>=j.daily_cap)toast('今日积分已达 2000 上限')}catch(e){console.error(e)}}
window.AIMUSIC_GUEST_AWARD=award;
window.AIMUSIC_ENSURE_GUEST=ensureGuest;
window.AIMUSIC_GUEST_API=guestApi;
async function restoreGuest(){if(!guestToken)return;try{guestInfo=await guestApi({action:'status',token:guestToken});updateGuestUI()}catch{guestToken='';localStorage.removeItem('aimusic_guest_token')}}
function markPlayState(){toggle.textContent=(!audio.paused&&i>=0)?'Ⅱ':'▶';songsEl.querySelectorAll('.song').forEach(el=>{const n=+el.dataset.i,on=n===i;el.classList.toggle('active',on);const btn=el.querySelector('.play');if(btn)btn.textContent=on&&!audio.paused?'Ⅱ':'▶'})}
function render(){document.querySelector('#count').textContent=songs.length+'首';if(!songs.length){songsEl.className='empty';songsEl.textContent='还没有审核通过的歌曲。';now.textContent='等待歌曲';return}songsEl.className='';songsEl.innerHTML=songs.map((s,n)=>`<div class="song ${n===i?'active':''}" data-i="${n}"><div class="num">${String(n+1).padStart(2,'0')}</div><div class="song-main"><b>${esc(s.title)}</b><small>${esc(s.artist)} · ${esc(s.genre)} · ${Number(s.plays||0)} 次播放</small></div><button class="play" data-i="${n}">${n===i&&!audio.paused?'Ⅱ':'▶'}</button></div>`).join('')}
function hydrateTracks(list){songs=(list||[]).map(s=>({...s,url:publicUrl(s.storage_path)}));if(songs.length&&i<0){i=0;now.textContent=songs[0].title+' · '+songs[0].artist}render()}
function readTrackCache(){try{const j=JSON.parse(localStorage.getItem(TRACK_CACHE)||'');if(Array.isArray(j)&&j.length){hydrateTracks(j);return true}}catch{}return false}
function writeTrackCache(){try{localStorage.setItem(TRACK_CACHE,JSON.stringify(songs.map(s=>({id:s.id,title:s.title,artist:s.artist,genre:s.genre,storage_path:s.storage_path,plays:s.plays}))))}catch{}}
async function loadSongs(){const {data,error}=await db.from('aimusic_tracks').select('id,title,artist,genre,storage_path,plays,approved_at').eq('status','approved').order('approved_at',{ascending:false});if(error){if(!songs.length){songsEl.className='empty';songsEl.textContent='曲库连接失败，请稍后刷新。'}return}hydrateTracks(data||[]);writeTrackCache()}
async function recordPlay(s){try{const {data}=await db.rpc('aimusic_record_play',{track_id:s.id});if(typeof data==='number')s.plays=data}catch{}}
async function play(n){if(!songs.length)return;i=(n+songs.length)%songs.length;const s=songs[i];audio.src=s.url;now.textContent=s.title+' · '+s.artist;try{await audio.play();markPlayState();recordPlay(s)}catch{markPlayState()}}
audio.onended=()=>play(i+1);audio.onpause=markPlayState;audio.onplay=markPlayState;
songsEl.onclick=e=>{const row=e.target.closest('.song');if(!row||!songsEl.contains(row))return;const n=+row.dataset.i;if(n===i&&!audio.paused)audio.pause();else if(n===i)audio.play();else play(n)};
document.querySelector('#next').onclick=()=>play(i<0?0:i+1);document.querySelector('#prev').onclick=()=>play(i<0?0:i-1);toggle.onclick=()=>{if(!songs.length)return;if(i<0)return play(0);audio.paused?audio.play():audio.pause()};
const uploadModal=document.querySelector('#uploadModal'),writeModal=document.querySelector('#writeModal'),pointsModal=document.querySelector('#pointsModal');
function loadWriter(){if(window.__AIMUSIC_WRITER)return window.__AIMUSIC_WRITER;window.__AIMUSIC_WRITER=new Promise((ok,fail)=>{const s=document.createElement('script');s.type='module';s.src='./ai-song.js?v=20260822-3';s.onload=ok;s.onerror=fail;document.body.appendChild(s)});return window.__AIMUSIC_WRITER}
document.querySelector('#uploadBtn').onclick=async()=>{await loadWriter();uploadModal.classList.add('show')};
document.querySelector('#writeBtn').onclick=async()=>{await loadWriter();writeModal.classList.add('show')};
document.querySelector('#pointsBtn').onclick=()=>{updateGuestUI();pointsModal.classList.add('show')};document.querySelector('#closePoints').onclick=()=>pointsModal.classList.remove('show');document.querySelectorAll('#uploadModal .close').forEach(x=>x.onclick=()=>uploadModal.classList.remove('show'));
document.querySelector('#communityLink').href=MAIN_SITE+'/community.html';
document.querySelector('#registerPoints').onclick=async()=>{await ensureGuest();location.href=MAIN_SITE+'/login.html?mode=register&aimusic_guest='+encodeURIComponent(guestToken)};
document.querySelector('#downloadBtn').onclick=async()=>{if(!songs.length){toast('当前没有可下载歌曲');return}const s=songs[i<0?0:i];try{const r=await fetch(s.url);if(!r.ok)throw new Error('下载失败');const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=(s.title||'AI-Music')+'.mp3';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);await award('download',s.id)}catch{window.open(s.url,'_blank')}};
if(window.AIMUSIC_IS_TELEGRAM){const s=document.createElement('script');s.src='./telegram-card.js?v=20260822-4';document.body.appendChild(s)}
readTrackCache();
Promise.all([restoreGuest(),loadSongs()]);
</script></body></html>
