<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Music</title>
<style>
:root{--bg:#0b1020;--card:#151c32;--soft:#202a48;--text:#f7f9ff;--muted:#9da8c8;--accent:#7c5cff;--accent2:#25c7ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#202a58 0,#0b1020 48%);color:var(--text);min-height:100vh}.app{max-width:720px;margin:auto;padding:24px 18px 120px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-weight:900;font-size:24px}.badge{font-size:12px;color:#b9c3df;background:#ffffff10;padding:7px 10px;border-radius:99px}.hero{padding:26px 22px;background:linear-gradient(135deg,#795cff,#159bd7);border-radius:26px;box-shadow:0 20px 60px #0005}.hero h1{font-size:31px;margin:0 0 9px}.hero p{margin:0;color:#eef3ff;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.btn{border:0;border-radius:16px;padding:15px;font-weight:800;font-size:15px;background:#fff;color:#10162a}.btn.alt{background:var(--soft);color:white}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}.section-title h2{font-size:19px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.song{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid #ffffff0d;border-radius:18px;margin:9px 0}.cover{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#25c7ff);display:grid;place-items:center;font-size:22px}.song b{display:block;margin-bottom:5px}.song small{color:var(--muted)}.play{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:16px}.empty{padding:28px;text-align:center;color:var(--muted);background:#ffffff08;border:1px dashed #ffffff22;border-radius:18px}.player{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(calc(100% - 24px),696px);background:#11182deb;backdrop-filter:blur(18px);border:1px solid #ffffff18;border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;box-shadow:0 15px 50px #0008}.now small{color:var(--muted);display:block;margin-bottom:3px}.controls{display:flex;gap:8px}.controls button{width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#111;font-size:16px}.modal{position:fixed;inset:0;background:#050814d9;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:5}.modal.show{display:flex}.sheet{width:min(100%,700px);background:#151c32;border-radius:26px;padding:20px}.sheet h3{margin:0 0 16px}.field{width:100%;padding:14px;border-radius:14px;border:1px solid #ffffff1c;background:#0d1428;color:white;margin:7px 0;font-size:16px}.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0}.hidden{display:none}</style>
</head>
<body><main class="app"><header><div class="brand">♫ AI Music</div><div class="badge">原创 AI 音乐社区</div></header>
<section class="hero"><h1>让每个人都能发表自己的声音</h1><p>原创歌曲、AI 音乐与独立创作者的连续音乐频道。审核通过的作品自动进入公共播放队列。</p></section>
<div class="actions"><button class="btn" id="writeBtn">✦ AI 写歌</button><button class="btn alt" id="uploadBtn">↑ 上传作品</button></div>
<div class="section-title"><h2>正在播放</h2><span id="count">0 首作品</span></div><div id="songs" class="empty">曲库还是空的。第一首原创作品上传审核后，就会从这里开始连续播放。</div>
</main>
<div class="player"><div class="now"><small>当前歌曲</small><b id="nowTitle">等待第一首作品</b></div><div class="controls"><button id="prev">‹</button><button id="toggle">▶</button><button id="next">›</button></div></div>
<audio id="audio" preload="metadata"></audio>
<div class="modal" id="uploadModal"><div class="sheet"><h3>上传原创歌曲</h3><input class="field" id="title" placeholder="歌曲名称"><input class="field" id="artist" placeholder="创作者名称"><select class="field" id="genre"><option>流行</option><option>电子</option><option>说唱</option><option>治愈</option><option>纯音乐</option><option>其他</option></select><input class="field" id="file" type="file" accept="audio/*"><p class="notice">仅上传你拥有权利或明确获准发布的作品。第一版先完成本机试听与投稿流程；公开曲库将在存储/审核服务接入后同步。</p><div class="row"><button class="btn alt close">取消</button><button class="btn" id="submit">加入待审核</button></div></div></div>
<div class="modal" id="writeModal"><div class="sheet"><h3>AI 写歌</h3><input class="field" id="theme" placeholder="写一个主题，例如：离开家乡后的第一个夜晚"><select class="field" id="mood"><option>温暖</option><option>伤感</option><option>励志</option><option>浪漫</option><option>自由</option></select><p class="notice">这里先建立真实创作入口，不伪造“已生成音频”。接入免费可用的歌词/音乐生成服务后，生成结果会直接进入投稿流程。</p><div class="row"><button class="btn alt close">取消</button><button class="btn" id="draft">生成创作草稿</button></div><textarea class="field hidden" id="draftText" rows="8"></textarea></div></div>
<script>
const audio=document.querySelector('#audio'),songsEl=document.querySelector('#songs'),now=document.querySelector('#nowTitle'),toggle=document.querySelector('#toggle');let songs=[],i=0;
function render(){document.querySelector('#count').textContent=songs.length+' 首作品';if(!songs.length)return;songsEl.className='';songsEl.innerHTML=songs.map((s,n)=>`<div class="song"><div class="cover">♫</div><div><b>${esc(s.title)}</b><small>${esc(s.artist)} · ${esc(s.genre)} · 待审核试听</small></div><button class="play" data-i="${n}">▶</button></div>`).join('');document.querySelectorAll('.play').forEach(b=>b.onclick=()=>play(+b.dataset.i))}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function play(n){if(!songs.length)return;i=(n+songs.length)%songs.length;audio.src=songs[i].url;now.textContent=songs[i].title+' · '+songs[i].artist;audio.play();toggle.textContent='Ⅱ'}
audio.onended=()=>play(i+1);document.querySelector('#next').onclick=()=>play(i+1);document.querySelector('#prev').onclick=()=>play(i-1);toggle.onclick=()=>{if(!songs.length)return;if(audio.paused){audio.play();toggle.textContent='Ⅱ'}else{audio.pause();toggle.textContent='▶'}};
const uploadModal=document.querySelector('#uploadModal'),writeModal=document.querySelector('#writeModal');document.querySelector('#uploadBtn').onclick=()=>uploadModal.classList.add('show');document.querySelector('#writeBtn').onclick=()=>writeModal.classList.add('show');document.querySelectorAll('.close').forEach(x=>x.onclick=()=>x.closest('.modal').classList.remove('show'));
document.querySelector('#submit').onclick=()=>{let f=document.querySelector('#file').files[0],title=document.querySelector('#title').value.trim(),artist=document.querySelector('#artist').value.trim();if(!f||!title||!artist){alert('请填写歌名、创作者并选择音频文件');return}songs.push({title,artist,genre:document.querySelector('#genre').value,url:URL.createObjectURL(f)});render();uploadModal.classList.remove('show');if(songs.length===1)play(0)};
document.querySelector('#draft').onclick=()=>{let t=document.querySelector('#theme').value.trim(),m=document.querySelector('#mood').value;if(!t){alert('先写歌曲主题');return}let out=document.querySelector('#draftText');out.classList.remove('hidden');out.value=`创作主题：${t}\n情绪方向：${m}\n\n歌曲结构建议：\n主歌：交代人物、场景与冲突\n预副歌：情绪逐渐抬升\n副歌：用一句核心表达形成记忆点\n第二主歌：增加新的细节与变化\n桥段：给故事一次转折\n最终副歌：回到核心表达并完成情绪释放\n\n下一步：接入 AI 歌词服务后，在这里直接生成完整原创歌词。`};
render();
</script></body></html>
