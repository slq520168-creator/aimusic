<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Music 审核后台</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f7f9ff}.wrap{max-width:760px;margin:auto;padding:20px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{font-size:24px;margin:0}.muted{color:#9da8c8}.card{background:#151c32;border:1px solid #ffffff12;border-radius:18px;padding:14px;margin:10px 0}.field{width:100%;padding:13px;border-radius:13px;border:1px solid #ffffff1d;background:#0d1428;color:#fff;margin:7px 0;font-size:16px;box-sizing:border-box}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:15px}.primary{background:#fff;color:#111}.good{background:#26c89b;color:#07140f}.bad{background:#ff5d6c;color:#fff}.soft{background:#273252;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tabs button.active{background:#fff;color:#111}.song h3{margin:0 0 6px}.song p{margin:5px 0;color:#aeb8d6;font-size:14px}.song audio{width:100%;margin:10px 0}.status{padding:12px;border-radius:12px;background:#ffffff0d;margin:10px 0;display:none}.status.show{display:block}</style></head><body><div class="wrap"><div class="top"><h1>♫ AI Music 审核后台</h1><a href="./" style="color:#9fd8ff">返回网站</a></div><section id="loginBox" class="card"><h3>管理员登录</h3><input class="field" id="email" type="email" placeholder="管理员邮箱"><input class="field" id="password" type="password" placeholder="密码"><button class="btn primary" id="login" style="width:100%">登录</button><div id="loginStatus" class="status"></div></section><section id="panel" hidden><div class="card"><div id="who" class="muted"></div><div class="tabs"><button class="btn soft active" data-status="pending">待审核</button><button class="btn soft" data-status="approved">已通过</button><button class="btn soft" data-status="rejected">已拒绝</button></div></div><div id="list"><div class="card muted">正在读取…</div></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>const URL='https://afzcohtnljnmucrkgcaz.supabase.co',KEY='sb_publishable_EqF-kTNRsSZWhUE8LWB8DQ_UNkTjImv',db=window.supabase.createClient(URL,KEY);const $=s=>document.querySelector(s);let current='pending';function showStatus(t){const e=$('#loginStatus');e.textContent=t;e.className='status show'}async function call(action,extra={}){const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('请先登录');const r=await fetch(URL+'/functions/v1/aimusic-admin',{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||j.error||'操作失败');return j}async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return;try{const me=await call('me');$('#loginBox').hidden=true;$('#panel').hidden=false;$('#who').textContent='管理员：'+me.email+' · '+me.role;load()}catch(e){await db.auth.signOut();showStatus('当前账号不是管理员')}}async function load(){const box=$('#list');box.innerHTML='<div class="card muted">正在读取…</div>';try{const j=await call('list',{status:current}),rows=j.data||[];if(!rows.length){box.innerHTML='<div class="card muted">当前没有'+(current==='pending'?'待审核':current==='approved'?'已通过':'已拒绝')+'歌曲。</div>';return}box.innerHTML=rows.map(x=>`<div class="card song"><h3>${esc(x.title)}</h3><p>创作者：${esc(x.artist)} · 风格：${esc(x.genre)} · 状态：${esc(x.status)}</p>${x.description?`<p>${esc(x.description)}</p>`:''}<audio controls preload="none" src="${x.audio_url}"></audio><div class="row">${current==='pending'?`<button class="btn good" onclick="act('approve','${x.id}')">通过并发布</button><button class="btn bad" onclick="act('reject','${x.id}')">拒绝</button>`:current==='rejected'?`<button class="btn soft" onclick="act('restore_pending','${x.id}')">退回待审核</button><button class="btn soft" disabled>已拒绝</button>`:`<button class="btn soft" disabled>已发布</button><button class="btn soft" disabled>${Number(x.plays||0)} 次播放</button>`}</div></div>`).join('')}catch(e){box.innerHTML='<div class="card">读取失败：'+esc(e.message)+'</div>'}}window.act=async(a,id)=>{const label=a==='approve'?'通过并发布':a==='reject'?'拒绝':'退回待审核';if(!confirm('确认'+label+'？'))return;try{const j=await call(a,{track_id:id});if(a==='approve'&&j.data?.telegram){const tg=j.data.telegram;const bad=Object.entries(tg).filter(([k,v])=>!v.ok);if(bad.length)alert('网站已发布，但部分 Telegram 同步失败：'+bad.map(([k,v])=>k+' '+(v.error||'')).join('\n'))}load()}catch(e){alert('操作失败：'+e.message)}};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('#login').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password){showStatus('请输入邮箱和密码');return}showStatus('正在登录…');const {error}=await db.auth.signInWithPassword({email,password});if(error){showStatus('登录失败：'+error.message);return}boot()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{current=b.dataset.status;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));load()});boot();</script></body></html>
