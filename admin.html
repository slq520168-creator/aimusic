<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Music 审核后台</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f7f9ff}.wrap{max-width:760px;margin:auto;padding:20px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{font-size:24px;margin:0}.muted{color:#9da8c8}.card{background:#151c32;border:1px solid #ffffff12;border-radius:18px;padding:14px;margin:10px 0}.field{width:100%;padding:13px;border-radius:13px;border:1px solid #ffffff1d;background:#0d1428;color:#fff;margin:7px 0;font-size:16px;box-sizing:border-box}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:15px;touch-action:manipulation}.btn:disabled{opacity:.55}.primary{background:#fff;color:#111}.good{background:#26c89b;color:#07140f}.bad{background:#ff5d6c;color:#fff}.soft{background:#273252;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tabs button.active{background:#fff;color:#111}.song h3{margin:0 0 6px}.song p{margin:5px 0;color:#aeb8d6;font-size:14px}.song audio{width:100%;margin:10px 0}.status{padding:12px;border-radius:12px;background:#ffffff0d;margin:10px 0;display:none;line-height:1.45}.status.show{display:block}.status.ok{background:#173c33;color:#b9ffe8}.status.err{background:#482127;color:#ffd0d5}.boot{padding:26px;text-align:center;color:#aeb8d6}</style></head><body><div class="wrap"><div class="top"><h1>♫ AI Music 审核后台</h1><a href="./" style="color:#9fd8ff">返回网站</a></div><section id="bootBox" class="card boot">正在验证管理员身份…</section><section id="loginBox" class="card" hidden><h3>管理员登录</h3><input class="field" id="email" type="email" autocomplete="username" placeholder="管理员邮箱"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="密码"><button class="btn primary" id="login" style="width:100%">登录</button><div id="loginStatus" class="status"></div></section><section id="panel" hidden><div class="card"><div id="who" class="muted"></div><div class="tabs"><button class="btn soft active" data-status="pending">待审核</button><button class="btn soft" data-status="approved">已通过</button><button class="btn soft" data-status="rejected">已拒绝</button></div><div id="actionStatus" class="status"></div></div><div id="list"><div class="card muted">正在读取…</div></div></section></div><script>
const URL='https://afzcohtnljnmucrkgcaz.supabase.co',KEY='sb_publishable_EqF-kTNRsSZWhUE8LWB8DQ_UNkTjImv';
const $=s=>document.querySelector(s);let current='pending',token=localStorage.getItem('aimusic_admin_token')||'',emailSaved=localStorage.getItem('aimusic_admin_email')||'',busy=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setStatus(el,text,type=''){el.textContent=text;el.className='status show'+(type?' '+type:'')}
function showLogin(msg=''){ $('#bootBox').hidden=true;$('#panel').hidden=true;$('#loginBox').hidden=false;if(emailSaved)$('#email').value=emailSaved;if(msg)setStatus($('#loginStatus'),msg,'err')}
function showPanel(){ $('#bootBox').hidden=true;$('#loginBox').hidden=true;$('#panel').hidden=false }
function clearSession(){token='';localStorage.removeItem('aimusic_admin_token')}
async function api(path,opt={}){const r=await fetch(URL+path,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j?.msg||j?.message||j?.error_description||j?.error||('HTTP '+r.status));return j}
async function call(action,extra={}){if(!token)throw new Error('请先登录');const r=await fetch(URL+'/functions/v1/aimusic-admin',{method:'POST',headers:{'content-type':'application/json','apikey':KEY,'authorization':'Bearer '+token},body:JSON.stringify({action,...extra})});let j={};try{j=await r.json()}catch{}if(r.status===401){clearSession();throw new Error('登录已失效，请重新登录')}if(!r.ok||!j.ok)throw new Error(j.message||j.error||j.detail?.error||'操作失败');return j}
async function login(){const btn=$('#login'),email=$('#email').value.trim(),password=$('#password').value;if(!email||!password){setStatus($('#loginStatus'),'请输入邮箱和密码','err');return}btn.disabled=true;setStatus($('#loginStatus'),'正在登录…');try{const j=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'content-type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});if(!j.access_token)throw new Error('未获得登录凭证');token=j.access_token;emailSaved=email;localStorage.setItem('aimusic_admin_token',token);localStorage.setItem('aimusic_admin_email',email);await boot()}catch(e){clearSession();setStatus($('#loginStatus'),'登录失败：'+e.message,'err')}finally{btn.disabled=false}}
async function boot(){if(!token){showLogin();return}try{const me=await call('me');showPanel();$('#who').textContent='管理员：'+(me.email||emailSaved)+' · '+me.role;await load()}catch(e){clearSession();showLogin(e.message||'当前账号不是管理员')}}
async function load(){const box=$('#list');box.innerHTML='<div class="card muted">正在读取…</div>';try{const j=await call('list',{status:current}),rows=j.data||[];if(!rows.length){box.innerHTML='<div class="card muted">当前没有'+(current==='pending'?'待审核':current==='approved'?'已通过':'已拒绝')+'歌曲。</div>';return}box.innerHTML=rows.map(x=>`<div class="card song" data-id="${esc(x.id)}"><h3>${esc(x.title)}</h3><p>创作者：${esc(x.artist)} · 风格：${esc(x.genre)} · 状态：${esc(x.status)}</p>${x.description?`<p>${esc(x.description)}</p>`:''}<audio controls preload="none" src="${esc(x.audio_url)}"></audio><div class="row">${current==='pending'?`<button class="btn good action-btn" data-action="approve" data-id="${esc(x.id)}">通过并发布</button><button class="btn bad action-btn" data-action="reject" data-id="${esc(x.id)}">拒绝</button>`:current==='rejected'?`<button class="btn soft action-btn" data-action="restore_pending" data-id="${esc(x.id)}">退回待审核</button><button class="btn soft" disabled>已拒绝</button>`:`<button class="btn soft" disabled>已发布</button><button class="btn soft" disabled>${Number(x.plays||0)} 次播放</button>`}</div></div>`).join('')}catch(e){box.innerHTML='<div class="card">读取失败：'+esc(e.message)+'</div>'}}
async function runAction(action,id,btn){if(busy)return;busy=true;const label=action==='approve'?'发布':action==='reject'?'拒绝':'退回待审核';const st=$('#actionStatus');document.querySelectorAll('.action-btn').forEach(b=>b.disabled=true);btn.textContent='处理中…';setStatus(st,'正在'+label+'，请稍候…');try{const j=await call(action,{track_id:id});let msg=label+'成功 ✓';if(action==='approve'&&j.data?.telegram){const bad=Object.entries(j.data.telegram).filter(([,v])=>!v.ok);if(bad.length)msg+='；网站已发布，但部分 Telegram 同步失败'}setStatus(st,msg,'ok');await load()}catch(e){setStatus(st,'操作失败：'+e.message,'err');await load()}finally{busy=false}}
$('#list').addEventListener('click',e=>{const btn=e.target.closest('.action-btn');if(!btn)return;e.preventDefault();runAction(btn.dataset.action,btn.dataset.id,btn)});
$('#login').addEventListener('click',login);$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(busy)return;current=b.dataset.status;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));load()});boot();
</script></body></html>
